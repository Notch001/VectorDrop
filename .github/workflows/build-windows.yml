name: Windows-Build
on:
  push:
    branches: [ccr-2756993b-4oxsdm]
    paths-ignore: ['**.md']
    tags: ['v*']
  workflow_dispatch:
env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ hashFiles('package-lock.json') }}
      - name: Abhängigkeiten installieren (mit Wiederholung)
        shell: bash
        run: for i in 1 2 3 4 5 6; do npm ci && break || { echo "Versuch $i fehlgeschlagen"; sleep 45; }; done; test -d node_modules/electron/dist
      - name: Windows-Programm bauen (bei Tag v* wird ein Release veröffentlicht)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: for i in 1 2 3 4 5 6; do npm run dist -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }} && break || { echo "Versuch $i fehlgeschlagen"; sleep 45; }; done; ls dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: VectorDrop-Windows
          path: dist/*.exe
