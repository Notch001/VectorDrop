name: Windows-Build
on:
  push:
    branches: [ccr-2756993b-4oxsdm]
    paths-ignore: ['**.md']
  workflow_dispatch:
env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Abhängigkeiten installieren (mit Wiederholung)
        shell: bash
        run: for i in 1 2 3 4; do npm ci && break || { echo "Versuch $i fehlgeschlagen"; sleep 30; }; done; test -d node_modules/electron/dist
      - name: Windows-Programm bauen
        shell: bash
        run: for i in 1 2 3 4; do npm run dist && break || { echo "Versuch $i fehlgeschlagen"; sleep 30; }; done; ls dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: VectorDrop-Windows
          path: dist/*.exe
